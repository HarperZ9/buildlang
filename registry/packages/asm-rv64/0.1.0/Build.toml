[package]
name = "asm-rv64"
version = "0.1.0"
edition = "2026"
description = "RV64I text assembler grown from the encoder of emu-rv64: one instruction per line, labels, .word and .org, the RV64I user set, Zicsr, MRET and WFI, with a renderer for the reverse direction; it holds no bit layout of its own and is checked by hand cases, the hand-assembled words and images of emu-rv64, property rules against that encoder and decoder, and planted controls"
author = "Zain Dana Harper"
license = "AGPL-3.0-only"

[dependencies]
emu-rv64 = "=0.4.0"
