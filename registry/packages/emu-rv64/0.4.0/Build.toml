[package]
name = "emu-rv64"
version = "0.4.0"
edition = "2026"
description = "RV64I machine emulator core with Zicsr, machine-mode CSRs, traps, MRET, a step-counted timer, machine interrupts, a flat image loader and a replay check that compares the state hash of two runs every 1000 steps: decoder, encoder and deterministic step function with flat memory and one serial device, checked by hand-computed cases, a reference model, differential fuzz, property rules and planted controls"
author = "Zain Dana Harper"
license = "AGPL-3.0-only"

