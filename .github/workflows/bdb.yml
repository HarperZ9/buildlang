name: bdb

# Builds BuildDB (qdb, bdb/db.bld) with the buildc of this checkout and runs its tests:
#   - bdb/tests/test_qdb.sh                 SQL regression harness
#   - bdb/tests/test_qdb_differential.py    randomized old-vs-new differential
#   - bdb/tests/test_qdb_wal_recovery.py    truncated-WAL crash recovery
#   - bdb/tests/test_qdb_crash.py           stop at every durable write and recover
#   - bdb/tests/test_qdb_faults.py          seeded power cuts: dropped, torn, reordered writes
#   - bdb/tests/test_qdb_text.py            text with | \ and line breaks round-trips
#   - bdb/tests/test_qdb_sqlite_oracle.py   2,000 generated queries against SQLite
#                                           (reported; it fails until NULL is apart from '')
#   - bdb/tests/test_qdb_lib.py             the static library (bdb/lib) against the CLI
#   - bdb/tests/test_qdb_mutations.py       INSERT, UPDATE and DELETE on indexed tables against SQLite
#   - bql::tests::in_process_subset_matches_qdb, the compiler's in-process BuildQL
#     subset checked against this qdb binary (QDB_BIN)
# A change to compiler/ runs it too: a codegen regression that breaks qdb fails here.
#
# QDB_ORACLE_REF is the reference engine for the differential and recovery tests: the
# last db.bld before the write-path rewrite (append-only WAL, lazy indexes), which was
# build-universe 577abe4 before the move. A change to the engine must keep its query
# output and its recovery behaviour byte-identical to that reference, or update the
# ref with a stated reason. Stated 2026-11-08: file format 1 adds a header line, which
# the differential strips before comparing .db files, and transactions now span
# processes, so its process mode compares the new build with its own REPL run.

on:
  pull_request:
    branches: [main]
    paths:
      - "bdb/**"
      - "compiler/**"
      - ".github/workflows/bdb.yml"
  push:
    branches: [main]
    paths:
      - "bdb/**"
      - "compiler/**"
      - ".github/workflows/bdb.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdb-${{ github.ref }}
  cancel-in-progress: true

env:
  QDB_ORACLE_REF: 7efcedd935467fc298e20035ebd3468099164f54  # build-universe 577abe4
  QDB_FAULTS_DIGEST: cd3ccf9f60f3ccabca7ab742c62388d93618458db638565fa2e7b321b8807c92

jobs:
  qdb:
    name: Build qdb with this buildc and run its tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Build buildc
        working-directory: compiler
        run: cargo build --release --locked

      - name: Show compiler
        run: compiler/target/release/buildc --version

      - name: Build qdb and the reference engine
        run: |
          BUILDC=compiler/target/release/buildc
          $BUILDC bdb/db.bld --target c -o "$RUNNER_TEMP/qdb.c"
          gcc -O2 -w -o bdb/qdb.exe "$RUNNER_TEMP/qdb.c" -lm
          test -x bdb/qdb.exe
          git show "$QDB_ORACLE_REF:bdb/db.bld" > "$RUNNER_TEMP/oracle.bld"
          $BUILDC "$RUNNER_TEMP/oracle.bld" --target c -o "$RUNNER_TEMP/oracle.c"
          gcc -O2 -w -o "$RUNNER_TEMP/qdb_oracle" "$RUNNER_TEMP/oracle.c" -lm
          test -x "$RUNNER_TEMP/qdb_oracle"

      - name: SQL regression harness
        run: bash bdb/tests/test_qdb.sh

      - name: Differential test against the reference engine
        # The reference engine predates NULL apart from '' (bdb/COMPLETE.md P7) and
        # float AVG (P8), so this workload has no NULL, no '' and no SUM or AVG;
        # those are checked by test_qdb.sh and the SQLite differential below.
        run: python3 bdb/tests/test_qdb_differential.py "$RUNNER_TEMP/qdb_oracle" bdb/qdb.exe --seeds 1,2,3,4,5,6,7,8 --no-null --no-float-agg

      - name: bql in-process subset against this qdb
        working-directory: compiler
        run: QDB_BIN="$GITHUB_WORKSPACE/bdb/qdb.exe" cargo test --release --locked --lib bql::tests::in_process_subset_matches_qdb

      - name: Crash test (stop at every durable write)
        run: python3 bdb/tests/test_qdb_crash.py bdb/qdb.exe

      - name: Seeded power cuts (10,000 seeds; digest must equal the Windows run, bdb/COMPLETE.md P15)
        # QDB_FAULTS_DIGEST is the digest of seeds 1 to 10,000 from the same qdb on Windows.
        # A change to the .db or WAL bytes changes it; update it with a stated reason.
        run: |
          python3 bdb/tests/test_qdb_faults.py bdb/qdb.exe --seeds 10000 --expect-digest "$QDB_FAULTS_DIGEST"
          python3 bdb/tests/test_qdb_faults.py bdb/qdb.exe --seeds 2000 --plant-ignore-flush

      - name: Receipts reproduced by a second process with AS OF (1,000 queries, bdb/COMPLETE.md P16)
        # Fails if any result is not reproduced or a planted check is missed. The overhead it
        # prints is reported, not gated.
        run: python3 bdb/tests/test_qdb_receipts.py bdb/qdb.exe --reps 3

      - name: Text round trip
        run: python3 bdb/tests/test_qdb_text.py bdb/qdb.exe

      - name: qdb as a C library (one handle, many statements, same output as the CLI)
        env:
          BUILDLANG_STDLIB: ${{ github.workspace }}/stdlib
        run: python3 bdb/tests/test_qdb_lib.py compiler/target/release/buildc bdb/qdb.exe --cc gcc

      - name: SQLite differential (2,000 queries must agree; bdb/COMPLETE.md row 1b)
        run: python3 bdb/tests/test_qdb_sqlite_oracle.py bdb/qdb.exe

      - name: Mutations on indexed tables against SQLite (bdb/COMPLETE.md P20)
        run: python3 bdb/tests/test_qdb_mutations.py bdb/qdb.exe

      - name: WAL truncation recovery test
        run: python3 bdb/tests/test_qdb_wal_recovery.py bdb/qdb.exe --old "$RUNNER_TEMP/qdb_oracle"
