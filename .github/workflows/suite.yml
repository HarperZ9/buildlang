name: suite
# The Build suite: the Python products that moved into this repository from their own.
# Each package installs on its own and runs its own tests.
on:
  push:
    branches: [main]
    paths: ['suite/**', '.github/workflows/suite.yml']
  pull_request:
    paths: ['suite/**', '.github/workflows/suite.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [build-engine, build-ui, build-finance, build-oracle, build-ecosystem]
    defaults:
      run:
        working-directory: suite/${{ matrix.package }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" || python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
