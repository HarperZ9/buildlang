name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # DXC pinned for the shader tests: DirectXShaderCompiler v1.9.2609
  # (2026-09-29), Linux x86_64 build. .github/install-shader-tools.sh refuses
  # a download whose SHA-256 differs.
  DXC_TAG: v1.9.2609
  DXC_ASSET: linux_dxc_2026_09_28.x86_x64.tar.gz
  DXC_SHA256: 96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1

jobs:
  skips:
    # Every skipped test links its issue; the self-test plants two unlinked
    # skips and two linked ones and needs the first refused, the second accepted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The skip check refuses planted unlinked skips
        run: bash .github/check-skips.sh --self-test
      - name: Every skip in this repository links an issue
        run: bash .github/check-skips.sh

  gpu-device:
    # The device tests in compiler/tests/gpu.rs (feature `gpu`) dispatch on
    # Mesa lavapipe and cross-check the CPU. A missing tool or device fails.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: gpu-feature
      - name: Install shader tools and lavapipe
        run: bash .github/install-shader-tools.sh
      - name: PLANTED CONTROL, reverted next commit - remove spirv-val
        run: sudo rm -f "$(command -v spirv-val)" && ! command -v spirv-val
      - name: CPU reference drivers (unit tests of the gpu module)
        working-directory: compiler
        run: cargo test --features gpu --bin buildc -- 'gpu::'
      - name: GPU tests on lavapipe
        working-directory: compiler
        env:
          BUILDLANG_SHADER_TOOLS_REQUIRE: '1'
        run: cargo test --features gpu --test gpu


  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - name: Clippy
        working-directory: compiler
        run: cargo clippy -- -D clippy::correctness -A clippy::complexity -A clippy::style -A clippy::pedantic -A clippy::perf
      - name: Format check
        working-directory: compiler
        run: cargo fmt --check

  docs-art:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Re-render the README art and compare it to what is committed
        run: python tools/check_repo_art.py

  test:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - name: Install shader tools
        if: runner.os == 'Linux'
        run: bash .github/install-shader-tools.sh
      - name: PLANTED CONTROL, reverted next commit - remove spirv-val
        if: runner.os == 'Linux'
        run: sudo rm -f "$(command -v spirv-val)" && ! command -v spirv-val
      - name: Run tests
        working-directory: compiler
        env:
          # A fuzz run skipped for want of a C compiler fails on Linux.
          BUILDLANG_FUZZ_REQUIRE_CC: ${{ runner.os == 'Linux' && '1' || '0' }}
          # A shader test skipped for want of spirv-val, glslang, DXC or a
          # Vulkan device fails on Linux, where the step above installs them.
          BUILDLANG_SHADER_TOOLS_REQUIRE: ${{ runner.os == 'Linux' && '1' || '0' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        # A commit whose message has a line `test-only: <name>` runs only
        # compiler/tests/<name>.rs, every test in it, and then fails: a
        # revert check. The rule is .github/test-only.sh.
        run: bash ../.github/test-only.sh
      - name: Build release
        working-directory: compiler
        run: cargo build --release
      - name: Lint the examples and benchmark sources
        shell: bash
        run: |
          BUILDC="compiler/target/release/buildc"
          if [ "$RUNNER_OS" = "Windows" ]; then BUILDC="${BUILDC}.exe"; fi
          export BUILDLANG_STDLIB="$PWD/stdlib"
          # Planted faults among the held-out controls: lint must refuse both.
          PLANTED="bench/heldout-2026-10-15/controls/gen/bits.bld bench/heldout-2026-11-08/controls/gen/binary.bld"
          FAIL=0; COUNT=0
          for f in $(git ls-files 'examples/*.bld' 'bench/*.bld'); do
            case " $PLANTED " in *" $f "*) continue ;; esac
            COUNT=$((COUNT + 1))
            if ! "$BUILDC" lint "$f" > lint.log 2>&1; then
              echo "LINT FAIL: $f"; cat lint.log; FAIL=$((FAIL + 1))
            fi
          done
          REFUSED=0
          for f in $PLANTED; do
            if "$BUILDC" lint "$f" > lint.log 2>&1; then
              echo "LINT ACCEPTED A PLANTED FAULT: $f"
            else
              REFUSED=$((REFUSED + 1))
            fi
          done
          echo "linted $COUNT files, $FAIL failed, $REFUSED of 2 planted faults refused"
          [ "$COUNT" -gt 0 ] && [ "$FAIL" -eq 0 ] && [ "$REFUSED" -eq 2 ]
      - name: Compile .bld test programs (end-to-end proof)
        shell: bash
        run: |
          BUILDC="compiler/target/release/buildc"
          if [ "$RUNNER_OS" = "Windows" ]; then BUILDC="${BUILDC}.exe"; fi

          pass=0; fail=0
          for f in tests/programs/01_hello.bld \
                   tests/programs/02_variables.bld \
                   tests/programs/03_functions.bld \
                   tests/programs/06_recursion.bld \
                   tests/programs/08_arithmetic.bld \
                   tests/programs/11_structs.bld \
                   tests/programs/16_closures.bld \
                   tests/programs/27_effects_showcase.bld \
                   tests/programs/46_color_science.bld \
                   tests/programs/68_hashmap.bld; do
            if $BUILDC "$f" --target c -o /dev/null 2>/dev/null; then
              echo "PASS: $(basename $f)"
              pass=$((pass + 1))
            else
              echo "FAIL: $(basename $f)"
              fail=$((fail + 1))
            fi
          done
          echo ""
          echo "=== $pass passed / $fail failed ==="
          if [ "$fail" -gt 0 ]; then exit 1; fi
      - name: Negative tests (must be REJECTED by compiler)
        shell: bash
        run: |
          BUILDC="compiler/target/release/buildc"
          if [ "$RUNNER_OS" = "Windows" ]; then BUILDC="${BUILDC}.exe"; fi

          neg_pass=0; neg_fail=0

          # Type mismatch
          echo 'fn main() { let x: i32 = "hello"; }' > /tmp/neg_type.bld
          if ! $BUILDC /tmp/neg_type.bld --target c -o /dev/null 2>/dev/null; then
            echo "  REJECT OK: type mismatch"; neg_pass=$((neg_pass + 1))
          else
            echo "  BUG: accepted type mismatch"; neg_fail=$((neg_fail + 1))
          fi

          # Undefined variable
          echo 'fn main() { let y = x + 1; }' > /tmp/neg_undef.bld
          if ! $BUILDC /tmp/neg_undef.bld --target c -o /dev/null 2>/dev/null; then
            echo "  REJECT OK: undefined variable"; neg_pass=$((neg_pass + 1))
          else
            echo "  BUG: accepted undefined variable"; neg_fail=$((neg_fail + 1))
          fi

          # Wrong arg count
          echo 'fn add(a: i32, b: i32) -> i32 { a + b } fn main() { add(1); }' > /tmp/neg_args.bld
          if ! $BUILDC /tmp/neg_args.bld --target c -o /dev/null 2>/dev/null; then
            echo "  REJECT OK: wrong arg count"; neg_pass=$((neg_pass + 1))
          else
            echo "  BUG: accepted wrong arg count"; neg_fail=$((neg_fail + 1))
          fi

          # Return type mismatch
          echo 'fn get() -> i32 { "not a number" } fn main() { get(); }' > /tmp/neg_ret.bld
          if ! $BUILDC /tmp/neg_ret.bld --target c -o /dev/null 2>/dev/null; then
            echo "  REJECT OK: return type mismatch"; neg_pass=$((neg_pass + 1))
          else
            echo "  BUG: accepted return type mismatch"; neg_fail=$((neg_fail + 1))
          fi

          echo ""
          echo "=== Negative tests: $neg_pass rejected / $neg_fail accepted ==="
          if [ "$neg_fail" -gt 0 ]; then exit 1; fi
      - name: End-to-end verification (compile + run + self-check)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BUILDC="compiler/target/release/buildc"

          # Compile color_test.bld → C → binary → run
          echo "=== color_test.bld: full pipeline ==="
          $BUILDC tests/programs/color_test.bld --target c -o /tmp/color_test.c
          gcc -O2 -o /tmp/color_test /tmp/color_test.c -lm
          /tmp/color_test
          if [ $? -ne 0 ]; then
            echo "FAIL: color_test binary returned nonzero"
            exit 1
          fi
          echo "=== Self-verifying test PASSED ==="

          # Cross-module import test: compile + run
          echo "=== cross_module_test.bld: mod geometry import ==="
          $BUILDC tests/programs/cross_module_test.bld --target c -o /tmp/cross_module_test.c
          gcc -O2 -o /tmp/cross_module_test /tmp/cross_module_test.c -lm
          /tmp/cross_module_test
          if [ $? -ne 0 ]; then
            echo "FAIL: cross_module_test binary returned nonzero"
            exit 1
          fi
          echo "=== Cross-module import test PASSED ==="
      - name: Proof kernel (mmk accepts a valid database, refuses planted faults)
        if: runner.os == 'Linux'
        env:
          BUILDC: compiler/target/release/buildc
        run: python3 tests/proofkernel/test_mmk.py -v
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py

  typeset:
    # The typeset engine's own tests and the rounding-class seed. Python standard library only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Typeset engine
        working-directory: typeset
        run: python -m unittest discover -s tests
      - name: Rounding classes of saxpy
        run: python tests/differential/test_saxpy_rounding.py
